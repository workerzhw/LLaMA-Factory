model_name_or_path: ./Qwen2-0.5B-Instruct
finetuning_type: lora
lora_target: q_proj,v_proj
lora_rank: 4
lora_alpha: 16
quantization_bit: 4  # 4bit量化，降低内存占用
data_path: ./data/alpaca_mini.json  # 小数据集适配边缘设备
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2e-4
fp16: true  # 启用FP16，适配ARM NEON指令集
output_dir: ./qwen_arm_finetune
